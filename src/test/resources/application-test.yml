spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  sql:
    init:
      mode: never

application:
  cors:
    allowed-origins: http://localhost:3000

  security:
    jwt:
      secret-key: myTestSecretKeyThatIsLongEnoughForHmacSha256Algorithm1234
      expiration: 3600000
      refresh-token:
        expiration: 86400000

  pagination:
    max-page-size: 100

  workspaces:
    constraints:
      max-users: 50
      max-events: 100

    invite-code:
      secret-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

  events:
    constraints:
      max-months-ahead: 12