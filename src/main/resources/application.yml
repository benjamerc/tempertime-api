spring:
  application:
    name: tempertime-api

  datasource:
    url: jdbc:mysql://localhost:3306/tempertime_db?useSSL=false&serverTimezone=UTC
    username: root
    password: REMOVED_PASSWORD
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      expiration: ${JWT_EXPIRATION}
      refresh-token:
        expiration: ${JWT_REFRESH_EXPIRATION}